<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoShiftMaker</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --danger: #d93025;
      --danger-hover: #b3261e;
      --success: #1e8e3e;
      --surface: #ffffff;
      --background: #f8f9fa;
      --border: #dadce0;
      --text: #202124;
      --text-secondary: #5f6368;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 4px 6px rgba(0, 0, 0, 0.1), 0 2px 4px rgba(0, 0, 0, 0.06);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 24px;
      line-height: 1.6;
      background: var(--background);
      color: var(--text);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 24px;
      color: var(--primary);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .hours-table-wrapper {
      overflow-x: auto;
    }

    .hours-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .hours-table th,
    .hours-table td {
      border: 1px solid var(--border);
      padding: 6px 4px;
      text-align: center;
      white-space: nowrap;
    }

    .hours-table th {
      background: var(--background);
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .hours-table input[type="number"] {
      width: 44px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
    }

    .hours-table input[type="number"]:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }

    .hours-table input[type="number"]::placeholder {
      color: var(--text-secondary);
      font-size: 11px;
    }

    .hint {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: -4px;
      margin-bottom: 12px;
    }

    .pattern-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .pattern-options label {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .checkbox-label {
      flex-direction: row;
      align-items: center;
      align-self: end;
      min-height: 40px;
      cursor: pointer;
    }

    .date-options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    .date-options label {
      flex-direction: row;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
    }

    input[type="text"],
    input[type="number"],
    input[type="month"],
    input[type="date"],
    input[type="time"],
    select {
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="month"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus,
    select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: var(--shadow);
    }

    .btn-generate {
      background: var(--success);
      color: #fff;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
    }

    .btn-generate:hover {
      background: #1b7d36;
      box-shadow: var(--shadow-lg);
    }

    .btn:disabled {
      cursor: progress;
      opacity: 0.6;
    }

    .btn[hidden] {
      display: none;
    }

    .btn-add {
      margin-top: 12px;
    }

    .registered-list {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
    }

    .registered-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--background);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .registered-list li span {
      flex: 1;
    }

    .delete-button {
      padding: 5px 12px;
      border: 1px solid var(--danger);
      background: transparent;
      color: var(--danger);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .delete-button:hover {
      background: var(--danger);
      color: #fff;
    }

    .edit-button {
      padding: 5px 12px;
      border: 1px solid var(--primary);
      background: transparent;
      color: var(--primary);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .edit-button:hover {
      background: var(--primary);
      color: #fff;
    }

    .message {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .error {
      background: #fce8e6;
      color: var(--danger);
      border: 1px solid #f5c6c2;
    }

    .success {
      background: #e6f4ea;
      color: var(--success);
      border: 1px solid #a8dab5;
    }

    .processing {
      background: #e8f0fe;
      color: var(--primary);
      border: 1px solid #aecbfa;
    }

    .shift-table-wrapper {
      overflow-x: auto;
      margin-top: 16px;
    }

    .export-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 8px;
    }

    .time-select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-select-group select {
      min-width: 72px;
    }

    table.shift-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    table.shift-table th,
    table.shift-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: center;
    }

    table.shift-table thead th {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      position: sticky;
      top: 0;
    }

    table.shift-table tbody tr:nth-child(even) {
      background: var(--background);
    }

    table.shift-table tbody tr:hover {
      background: #e8f0fe;
    }

    table.shift-table td.worker-cell {
      text-align: left;
      font-size: 12px;
    }

    .worker-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      background: #e8f0fe;
      color: var(--primary);
      font-size: 11px;
      font-weight: 500;
      margin: 1px 2px;
    }

    .temporary-absence-badge {
      background: #fce8e6;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AutoShiftMaker</h1>

    <div class="card">
      <h2>作成条件</h2>
      <button id="loadTestPattern" type="button" class="btn btn-primary btn-add">テストパターンを読み込む</button>
      <div class="grid">
        <label>対象月
          <input id="month" type="month" />
        </label>
      </div>
      <p class="hint">連続勤務は最大4日です。</p>
    </div>

    <div class="card">
      <h2>時間帯ごとの必要勤務人数</h2>
      <p class="hint">未入力の時間帯は、直前の時間帯と同じ人数として扱われます。</p>
      <div class="hours-table-wrapper">
        <table class="hours-table" id="hoursTable">
          <thead>
            <tr id="hoursHeaderRow"></tr>
          </thead>
          <tbody>
            <tr id="hoursInputRow"></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>勤務体系登録</h2>
      <div class="grid">
        <label>勤務体系名
          <input id="patternName" type="text" placeholder="A" />
        </label>
        <label>開始時刻（0〜23）
          <input id="patternStartHour" type="number" min="0" max="23" value="14" />
        </label>
        <label>終了時刻（0〜23）
          <input id="patternEndHour" type="number" min="0" max="23" value="18" />
        </label>
        <label class="checkbox-label">
          <input id="patternNextDayOff" type="checkbox" />
          翌日を公休にする
        </label>
      </div>
      <button id="addPattern" type="button" class="btn btn-primary btn-add">勤務体系を追加</button>
      <ul id="patternList" class="registered-list"></ul>
    </div>

    <div class="card">
      <h2>勤務者登録</h2>
      <div class="grid">
        <label>勤務者名
          <input id="workerName" type="text" placeholder="山田" />
        </label>
        <label>月間公休日数
          <input id="workerDaysOff" type="number" min="0" max="31" value="9" />
        </label>
        <label>勤務可能な勤務体系（複数選択可）
          <div id="workerPatternOptions"></div>
        </label>
        <label>希望休（複数選択可）
          <div id="workerRequestedDaysOffOptions" class="date-options"></div>
        </label>
      </div>
      <button id="addWorker" type="button" class="btn btn-primary btn-add">勤務者を追加</button>
      <button id="saveRequestedDaysOff" type="button" class="btn btn-primary btn-add" hidden>希望休を更新</button>
      <button id="cancelRequestedDaysOffEdit" type="button" class="btn btn-add" hidden>編集をキャンセル</button>
      <ul id="workerList" class="registered-list"></ul>
    </div>

    <div class="card">
      <h2>勤務人数対象外時間の登録</h2>
      <p class="hint">ヘルプや委員会活動など、出勤日として勤務日数に数える一方、指定時間はシフト上の勤務人数に含めない条件を登録します。</p>
      <div class="grid">
        <label>担当者（複数選択可）
          <div id="absenceWorkerOptions" class="pattern-options"></div>
        </label>
        <label>抜ける日
          <input id="absenceDate" type="date" />
        </label>
        <label>抜ける時間（開始）
          <span class="time-select-group">
            <select id="absenceStartHour" aria-label="抜ける時間（開始）の時"></select>時
            <select id="absenceStartMinute" aria-label="抜ける時間（開始）の分"></select>分
          </span>
        </label>
        <label>抜ける時間（終了）
          <span class="time-select-group">
            <select id="absenceEndHour" aria-label="抜ける時間（終了）の時"></select>時
            <select id="absenceEndMinute" aria-label="抜ける時間（終了）の分"></select>分
          </span>
        </label>
      </div>
      <button id="saveAbsence" type="button" class="btn btn-primary btn-add">対象外時間を追加</button>
      <button id="cancelAbsenceEdit" type="button" class="btn btn-add" hidden>編集をキャンセル</button>
      <ul id="absenceList" class="registered-list"></ul>
    </div>

    <div class="card" style="text-align: center;">
      <button id="generate" type="button" class="btn btn-generate">シフト表を作成</button>
      <button id="cancelGeneration" type="button" class="btn btn-add" hidden>計算をキャンセル</button>
    </div>

    <div id="output"></div>
  </div>

  <script>
    const hoursHeaderRow = document.getElementById('hoursHeaderRow');
    const hoursInputRow = document.getElementById('hoursInputRow');
    for (let hour = 0; hour < 24; hour += 1) {
      const th = document.createElement('th');
      th.textContent = `${String(hour).padStart(2, '0')}:00`;
      hoursHeaderRow.appendChild(th);

      const td = document.createElement('td');
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      if (hour === 0) {
        input.value = '0';
      } else {
        input.placeholder = '同上';
      }
      input.id = `hour-${hour}`;
      td.appendChild(input);
      hoursInputRow.appendChild(td);
    }

    const absenceStartHour = document.getElementById('absenceStartHour');
    const absenceEndHour = document.getElementById('absenceEndHour');
    for (let hour = 0; hour < 24; hour += 1) {
      for (const select of [absenceStartHour, absenceEndHour]) {
        const option = document.createElement('option');
        option.value = String(hour).padStart(2, '0');
        option.textContent = String(hour).padStart(2, '0');
        select.appendChild(option);
      }
    }
    const absenceStartMinute = document.getElementById('absenceStartMinute');
    const absenceEndMinute = document.getElementById('absenceEndMinute');
    for (const minute of ['00', '15', '30', '45']) {
      for (const select of [absenceStartMinute, absenceEndMinute]) {
        const option = document.createElement('option');
        option.value = minute;
        option.textContent = minute;
        select.appendChild(option);
      }
    }
    absenceStartHour.value = '12';
    absenceEndHour.value = '13';
  </script>
  <script src="./scheduler.js"></script>
  <script src="./test-pattern.js"></script>
  <script src="./exporter.js"></script>
  <script src="./app.js"></script>
</body>
</html>
